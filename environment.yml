# Frozen environment for training, inference and evaluation (scripts/, models/, data/, evaluation/).
# Versions match the environment that produced the manuscript results.
#   conda env create -f environment.yml
#   conda activate metasight
# The agentic ensemble search (agentic_evolutionary_optimization_framework_implementation/)
# needs numpy>=2 and therefore Python>=3.9; install it in a separate environment.
name: metasight
channels:
  - conda-forge
dependencies:
  - python=3.8.20
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.4.1+cu118
      - torchvision==0.19.1+cu118
      - numpy==1.24.4
      - pandas==2.0.3
      - scikit-learn==1.3.2
      - scipy==1.10.1
      - torchmetrics==1.5.2
      - statsmodels==0.14.1
      - lifelines==0.27.8
      - h5py==3.11.0
      - anndata==0.9.2
      - matplotlib==3.7.5
      - seaborn==0.13.2
      - tqdm==4.67.3
      - pyyaml==6.0.3
